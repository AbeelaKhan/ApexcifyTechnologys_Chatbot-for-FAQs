<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FAST-NUCES FAQ Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #f5f3ef;
    --surface:      #ffffff;
    --border:       #e4e0d8;
    --text-primary: #1a1814;
    --text-secondary:#6b6660;
    --text-muted:   #a09c97;
    --accent:       #2d5a3d;
    --accent-light: #e8f0ea;
    --tag-bg:       #f0ede8;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .wrapper {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    height: 92vh;
    max-height: 820px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
  }

  .logo {
    width: 42px; height: 42px;
    background: var(--accent);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', serif;
    color: white; font-size: 15px;
    flex-shrink: 0;
  }

  .header-text h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 17px; font-weight: 400;
    color: var(--text-primary); letter-spacing: -0.3px;
  }

  .header-text p {
    font-size: 12px; color: var(--text-muted);
    font-weight: 300; margin-top: 1px;
  }

  .status-dot {
    width: 7px; height: 7px;
    background: #5aac6e; border-radius: 50%;
    margin-left: auto;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.35; }
  }

  .chat-area {
    flex: 1; overflow-y: auto;
    padding: 24px 20px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-row {
    display: flex; gap: 10px;
    animation: fadeUp 0.28s ease both;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(8px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
    flex-shrink: 0; margin-top: 2px;
  }

  .avatar.bot  { background: var(--accent-light); color: var(--accent); }
  .avatar.user { background: var(--accent); color: white; }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px; line-height: 1.65;
  }

  .bubble.bot {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .bubble.user {
    background: var(--accent);
    color: #fff;
    border-top-right-radius: 4px;
  }

  .badge {
    display: inline-block;
    font-size: 10px; font-weight: 500;
    padding: 2px 8px; border-radius: 20px;
    margin-top: 8px; letter-spacing: 0.2px;
  }

  .badge.high   { background:#e6f4ea; color:#2d7a3a; }
  .badge.medium { background:#fef9e6; color:#a07a10; }
  .badge.low    { background:#fceaea; color:#9a2a2a; }
  .badge.none   { background:#f0ede8; color:#7a6a60; }

  .matched-q {
    font-size: 11px; color: var(--text-muted);
    margin-top: 5px; font-style: italic;
  }

  .suggestions-label {
    font-size: 11px; color: var(--text-muted);
    font-weight: 500; letter-spacing: 0.3px;
    text-transform: uppercase; margin-bottom: 8px;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }

  .chip {
    background: var(--tag-bg);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px; font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .chip:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  .typing-indicator {
    display: flex; gap: 4px;
    padding: 14px 16px; align-items: center;
  }

  .dot {
    width: 6px; height: 6px;
    background: var(--text-muted); border-radius: 50%;
    animation: bounce 1.2s infinite ease-in-out;
  }

  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%,80%,100% { transform:translateY(0); }
    40%          { transform:translateY(-5px); }
  }

  .input-area {
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0 0 20px 20px;
    display: flex; gap: 10px; align-items: center;
  }

  .input-field {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-primary);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }

  .input-field::placeholder { color: var(--text-muted); }
  .input-field:focus { border-color: var(--accent); }

  .send-btn {
    width: 40px; height: 40px;
    background: var(--accent);
    border: none; border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .send-btn:hover { opacity: 0.85; }
  .send-btn:active { transform: scale(0.93); }
  .send-btn svg { width: 16px; height: 16px; fill: white; }

</style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="logo">FN</div>
    <div class="header-text">
      <h1>FAST-NUCES Assistant</h1>
      <p>Ask me anything about admissions, fees, programs &amp; more</p>
    </div>
    <div class="status-dot"></div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-area">
    <input
      class="input-field"
      id="userInput"
      type="text"
      placeholder="Type your question…"
      autocomplete="off"
    />
    <button class="send-btn" id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>


<script>
const chatArea  = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn   = document.getElementById('sendBtn');

const suggestions = [
  "What are the tuition fees?",
  "Admission requirements?",
  "Available scholarships?",
  "Which campuses exist?",
  "What programs are offered?",
  "Is hostel available?",
  "What is the grading system?",
  "Minimum attendance requirement?"
];

function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function addMessage(html, role) {
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const av = document.createElement('div');
  av.className = `avatar ${role}`;
  av.textContent = role === 'user' ? 'U' : 'FN';
  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = html;
  row.appendChild(av);
  row.appendChild(bubble);
  chatArea.appendChild(row);
  scrollBottom();
}

function showTyping() {
  const row = document.createElement('div');
  row.id = 'typingRow';
  row.className = 'msg-row bot';
  const av = document.createElement('div');
  av.className = 'avatar bot';
  av.textContent = 'FN';
  const bubble = document.createElement('div');
  bubble.className = 'bubble bot typing-indicator';
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  row.appendChild(av);
  row.appendChild(bubble);
  chatArea.appendChild(row);
  scrollBottom();
}

function removeTyping() {
  const el = document.getElementById('typingRow');
  if (el) el.remove();
}

const badgeMap = {
  high:   '● High confidence',
  medium: '◐ Moderate match',
  low:    '○ Low confidence',
  none:   '— No match'
};

function renderWelcome() {
  const chipsHtml = suggestions
    .map(s => `<button class="chip" onclick="useChip(this)">${s}</button>`)
    .join('');
  addMessage(`
    Hello! I'm the <strong>FAST-NUCES FAQ Assistant</strong>.
    Ask me anything about admissions, fees, programs, or campus life.
    <br><br>
    <div class="suggestions-label">Popular questions</div>
    <div class="chips">${chipsHtml}</div>
  `, 'bot');
}

function useChip(btn) {
  userInput.value = btn.textContent;
  handleSend();
}

async function handleSend() {
  const query = userInput.value.trim();
  if (!query) return;
  userInput.value = '';
  userInput.disabled = true;
  sendBtn.disabled = true;

  addMessage(query, 'user');
  showTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: query })
    });

    const data = await res.json();
    removeTyping();

    const badge   = `<span class="badge ${data.confidence}">${badgeMap[data.confidence] || '—'}</span>`;
    const matched = data.matched_question
      ? `<div class="matched-q">Matched: "${data.matched_question}" &nbsp;·&nbsp; score: ${data.score}</div>`
      : '';

    addMessage(`${data.answer}<br>${matched}${badge}`, 'bot');

  } catch (err) {
    removeTyping();
    addMessage(
      `Could not reach the server. Make sure <code>app.py</code> is running.<br>
       <span class="badge none">— Connection error</span>`,
      'bot'
    );
  }

  userInput.disabled = false;
  sendBtn.disabled = false;
  userInput.focus();
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

renderWelcome();
</script>
</body>
</html>
